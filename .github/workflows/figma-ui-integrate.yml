name: VIZIT Figma integration development

on:
  push:
    branches: [chore/figma-ui-integration-work-20260921]
    paths: [.github/workflows/figma-ui-integrate.yml]

permissions:
  contents: write

concurrency:
  group: vizit-figma-integration-development
  cancel-in-progress: false

jobs:
  implement:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      BASE_COMMIT: 66c351681baf219423eeab4d209f55ff98da312b
      TARGET_BRANCH: feature/figma-ui-complete-20260921
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed implementation to the exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'RayWorksHub/vizitkartya-app'
          cp scripts/figma-ui-integration.py "$RUNNER_TEMP/integrate.py"
          current="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current" = "$BASE_COMMIT" || { echo 'The target branch changed. Refusing to overwrite concurrent work.'; exit 1; }
          git checkout --detach "$BASE_COMMIT"
          python3 "$RUNNER_TEMP/integrate.py"
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'ios/Vizit/Design/VizitComponents.swift',
              'ios/Vizit/App/VizitApp.swift',
              'ios/Vizit/App/ProfileEditor.swift',
              'ios/Vizit/App/Screens.swift',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit('Unexpected changed-file set: ' + repr(actual))
          PY
      - name: Compile iOS application only - no tests and no distribution
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild \
            -project ios/VIZIT.xcodeproj \
            -scheme VIZIT \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VIZIT-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/compile.log" 2>&1 || {
              grep -n -E 'error:|BUILD FAILED|warning:' "$RUNNER_TEMP/compile.log" | tail -60
              exit 1
            }
          tail -5 "$RUNNER_TEMP/compile.log"
      - name: Commit development changes without triggering TestFlight
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current" = "$BASE_COMMIT" || { echo 'Concurrent branch update; no push performed.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/Vizit/Design/VizitComponents.swift ios/Vizit/App/VizitApp.swift ios/Vizit/App/ProfileEditor.swift ios/Vizit/App/Screens.swift
          git commit -m 'feat(ios): connect Figma feedback, search and lifecycle states [skip ci]'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          mkdir -p "$RUNNER_TEMP/receipt"
          git diff "$BASE_COMMIT" HEAD --stat > "$RUNNER_TEMP/receipt/change-summary.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/receipt/commit.txt"
          git archive --format=zip --output="$RUNNER_TEMP/receipt/changed-source.zip" HEAD \
            ios/Vizit/Design/VizitComponents.swift ios/Vizit/App/VizitApp.swift \
            ios/Vizit/App/ProfileEditor.swift ios/Vizit/App/Screens.swift
          {
            echo '# Figma UI development batch'
            echo "Commit: $(git rev-parse HEAD)"
            echo 'Real feedback, search, permission, expired-session, loading and automatic-sync controls integrated.'
            echo 'iOS compilation: successful. Tests: not run. TestFlight: not uploaded. Full plan: still in progress.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vizit-figma-integration-development
          path: |
            ${{ runner.temp }}/receipt/
            ${{ runner.temp }}/compile.log
          if-no-files-found: warn
          retention-days: 2
