name: VIZIT profile photo checks
on:
  push:
    branches: [feature/vizit-public-profile-photo]
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: vizit-ios-source
          path: |
            ios
            scripts
            .github/workflows
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - run: swift test --package-path ios
