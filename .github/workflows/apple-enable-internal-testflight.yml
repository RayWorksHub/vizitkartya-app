name: Enable production internal TestFlight

on:
  push:
    branches: [main, chore/enable-production-internal-testflight]
    paths:
      - scripts/apple-enable-internal-testflight.py
      - .github/workflows/apple-enable-internal-testflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install 'PyJWT[crypto]>=2.8,<3'
      - run: "$RUNNER_TEMP/venv/bin/python scripts/apple-enable-internal-testflight.py"
