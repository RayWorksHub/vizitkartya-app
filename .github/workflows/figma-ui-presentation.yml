name: VIZIT Figma presentation development
on:
  push:
    branches: [chore/figma-ui-integration-work-20260921]
    paths: [.github/workflows/figma-ui-presentation.yml]
permissions:
  contents: write
concurrency:
  group: vizit-figma-integration-development
  cancel-in-progress: false
jobs:
  implement:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      BASE_COMMIT: 51c0e1a48493a8fcdba1ecf2cfa4a1e019680f7a
      TARGET_BRANCH: feature/figma-ui-complete-20260921
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed presentation implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'RayWorksHub/vizitkartya-app'
          cp scripts/figma-ui-presentation.py "$RUNNER_TEMP/integrate.py"
          current="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current" = "$BASE_COMMIT" || { echo 'Concurrent target update; refusing to overwrite it.'; exit 1; }
          git checkout --detach "$BASE_COMMIT"
          python3 "$RUNNER_TEMP/integrate.py"
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'ios/Vizit/Core/CardPresentation.swift',
              'ios/Vizit/Design/VizitDigitalCard.swift',
              'ios/Vizit/App/CardCustomization.swift',
              'ios/Vizit/App/VizitApp.swift',
              'ios/Vizit/App/ProfileEditor.swift',
              'ios/Vizit/App/Screens.swift',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit('Unexpected changed-file set: ' + repr(actual))
          PY
      - name: Compile iOS application - no tests, no signing, no upload
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -project ios/VIZIT.xcodeproj -scheme VIZIT -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/VIZIT-derived" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/compile.log" 2>&1 || {
              grep -n -E 'error:|BUILD FAILED|warning:' "$RUNNER_TEMP/compile.log" | tail -60
              exit 1
            }
          tail -5 "$RUNNER_TEMP/compile.log"
      - name: Commit development changes without TestFlight
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current" = "$BASE_COMMIT" || { echo 'Concurrent update; no push performed.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/Vizit/Core/CardPresentation.swift ios/Vizit/Design/VizitDigitalCard.swift \
            ios/Vizit/App/CardCustomization.swift ios/Vizit/App/VizitApp.swift \
            ios/Vizit/App/ProfileEditor.swift ios/Vizit/App/Screens.swift
          git commit -m 'feat(ios): apply PDF navigation and persist real card section ordering [skip ci]'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          mkdir -p "$RUNNER_TEMP/receipt"
          git diff "$BASE_COMMIT" HEAD --stat > "$RUNNER_TEMP/receipt/change-summary.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/receipt/commit.txt"
          git archive --format=zip --output="$RUNNER_TEMP/receipt/changed-source.zip" HEAD \
            ios/Vizit/Core/CardPresentation.swift ios/Vizit/Design/VizitDigitalCard.swift \
            ios/Vizit/App/CardCustomization.swift ios/Vizit/App/VizitApp.swift \
            ios/Vizit/App/ProfileEditor.swift ios/Vizit/App/Screens.swift
          {
            echo '# Figma presentation development'
            echo "Commit: $(git rev-parse HEAD)"
            echo 'Flat navigation, profile presentation drafts, section ordering, live preview and player retry are integrated.'
            echo 'iOS compilation: successful. Tests: not run. TestFlight: not uploaded. Full plan: still in progress.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vizit-figma-presentation-development
          path: |
            ${{ runner.temp }}/receipt/
            ${{ runner.temp }}/compile.log
          retention-days: 2
          if-no-files-found: warn
