name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_VIZIT_DEV_SUPABASE_URL: ${{ secrets.VIZIT_DEV_SUPABASE_URL }}
      ORG_GRADLE_PROJECT_VIZIT_DEV_SUPABASE_KEY: ${{ secrets.VIZIT_DEV_SUPABASE_KEY }}
      ORG_GRADLE_PROJECT_VIZIT_PRIVACY_POLICY_URL: ${{ secrets.VIZIT_PRIVACY_POLICY_URL }}
      ORG_GRADLE_PROJECT_VIZIT_PRIVACY_POLICY_VERSION: ${{ secrets.VIZIT_PRIVACY_POLICY_VERSION }}
      ORG_GRADLE_PROJECT_VIZIT_TERMS_URL: ${{ secrets.VIZIT_TERMS_URL }}
      ORG_GRADLE_PROJECT_VIZIT_TERMS_VERSION: ${{ secrets.VIZIT_TERMS_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Check Supabase source syntax
        run: |
          node --check scripts/supabase-auth-e2e.mjs
          node scripts/check-supabase-source.mjs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDevDebugUnitTest

      - name: Lint
        run: ./gradlew lintDevDebug

      - name: Build development APK
        run: ./gradlew assembleDevDebug

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: vizit-dev-debug
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build beta APK
        run: ./gradlew assembleBetaDebug

      - name: Compile production release
        run: ./gradlew assembleProdRelease
