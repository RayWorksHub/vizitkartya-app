name: Apple production bootstrap
# Also reports whether the App Store Connect app record already exists.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      APPLE_PROVISIONING_API_KEY_ID: ${{ secrets.APPLE_PROVISIONING_API_KEY_ID }}
      APPLE_PROVISIONING_API_ISSUER_ID: ${{ secrets.APPLE_PROVISIONING_API_ISSUER_ID }}
      APPLE_PROVISIONING_API_KEY_BASE64: ${{ secrets.APPLE_PROVISIONING_API_KEY_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Apple credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_PROVISIONING_API_KEY_ID APPLE_PROVISIONING_API_ISSUER_ID APPLE_PROVISIONING_API_KEY_BASE64 APPLE_DISTRIBUTION_CERTIFICATE_BASE64 APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD; do
            test -n "${!name}" || { echo "Missing required Apple credential: $name"; exit 1; }
          done

      - name: Install JWT dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/apple-bootstrap-venv"
          "$RUNNER_TEMP/apple-bootstrap-venv/bin/python" -m pip install 'PyJWT[crypto]>=2.8,<3'
          echo "APPLE_BOOTSTRAP_PYTHON=$RUNNER_TEMP/apple-bootstrap-venv/bin/python" >> "$GITHUB_ENV"

      - name: Read distribution certificate serial
        shell: bash
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/VIZIT-distribution.p12"
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$cert"
          serial="$(
            openssl pkcs12 -in "$cert" -clcerts -nokeys -passin env:APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD 2>/dev/null |
            openssl x509 -noout -serial |
            sed 's/^serial=//'
          )"
          test -n "$serial"
          echo "APPLE_CERTIFICATE_SERIAL=$serial" >> "$GITHUB_ENV"

      - name: Register production App ID and create provisioning profile
        run: |
          "$APPLE_BOOTSTRAP_PYTHON" scripts/apple-production-bootstrap.py \
            --bundle-id hu.rayworks.vizit \
            --bundle-name VIZIT \
            --profile-name "VIZIT App Store Production" \
            --certificate-serial "$APPLE_CERTIFICATE_SERIAL" \
            --output "$RUNNER_TEMP/VIZIT-App-Store-Production.mobileprovision"

      - name: Validate generated provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          security cms -D -i "$RUNNER_TEMP/VIZIT-App-Store-Production.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          test "$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")" = "VIZIT App Store Production"
          test "$(plutil -extract Entitlements.application-identifier raw "$RUNNER_TEMP/profile.plist")" = "K7BC6R47KA.hu.rayworks.vizit"
          echo "Production Apple App ID and provisioning profile: PASS"
