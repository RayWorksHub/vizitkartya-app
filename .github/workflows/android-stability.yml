name: Android profile stability
on:
  push:
    branches: [fix/beta-share-stability]
    paths: ['app/**', 'config/**', 'gradle/**', '*.kts', 'gradle.properties', '.github/workflows/android-stability.yml']
  pull_request:
    branches: [develop]
    paths: ['app/**', 'config/**', '.github/workflows/android-stability.yml']
permissions:
  contents: read
concurrency:
  group: android-stability-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORG_GRADLE_PROJECT_VIZIT_DEV_SUPABASE_URL: https://gixihulrptmleltxccxn.supabase.co
      ORG_GRADLE_PROJECT_VIZIT_DEV_SUPABASE_KEY: sb_publishable_msnliCDr1R9T2t9j-2T-Bg_IgXLWZjH
      ORG_GRADLE_PROJECT_VIZIT_PRIVACY_POLICY_URL: ${{ secrets.VIZIT_PRIVACY_POLICY_URL }}
      ORG_GRADLE_PROJECT_VIZIT_PRIVACY_POLICY_VERSION: ${{ secrets.VIZIT_PRIVACY_POLICY_VERSION }}
      ORG_GRADLE_PROJECT_VIZIT_TERMS_URL: ${{ secrets.VIZIT_TERMS_URL }}
      ORG_GRADLE_PROJECT_VIZIT_TERMS_VERSION: ${{ secrets.VIZIT_TERMS_VERSION }}
      VIZIT_DEV_SIGNING_KEYSTORE_BASE64: ${{ secrets.VIZIT_DEV_SIGNING_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_VIZIT_DEV_SIGNING_PASSWORD: ${{ secrets.VIZIT_DEV_SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_VIZIT_DEV_GOOGLE_WEB_CLIENT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate configuration and preserve stable DEV signing
        run: |
          set -euo pipefail
          test -n "$ORG_GRADLE_PROJECT_VIZIT_PRIVACY_POLICY_URL"
          test -n "$ORG_GRADLE_PROJECT_VIZIT_TERMS_URL"
          test -n "$ORG_GRADLE_PROJECT_VIZIT_PRIVACY_POLICY_VERSION"
          test -n "$ORG_GRADLE_PROJECT_VIZIT_TERMS_VERSION"
          test -n "$VIZIT_DEV_SIGNING_KEYSTORE_BASE64"
          test -n "$ORG_GRADLE_PROJECT_VIZIT_DEV_SIGNING_PASSWORD"
          mkdir -p "$RUNNER_TEMP/vizit-signing"
          printf '%s' "$VIZIT_DEV_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vizit-signing/vizit-dev.jks"
          chmod 600 "$RUNNER_TEMP/vizit-signing/vizit-dev.jks"
          echo "ORG_GRADLE_PROJECT_VIZIT_DEV_SIGNING_STORE_FILE=$RUNNER_TEMP/vizit-signing/vizit-dev.jks" >> "$GITHUB_ENV"
          chmod +x gradlew
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, lint and DEV compilation
        run: ./gradlew testDevDebugUnitTest lintDevDebug assembleDevDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android runtime and SQLite regression tests (emulator, not physical phone)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: ./gradlew connectedDevDebugAndroidTest --stacktrace
      - name: Record exact artifact hash and signing certificate
        run: |
          mkdir -p release-evidence
          sha256sum app/build/outputs/apk/dev/debug/app-dev-debug.apk > release-evidence/android.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/dev/debug/app-dev-debug.apk > release-evidence/android-certificate.txt
          cp config/sharing.properties release-evidence/
          printf 'source=%s\nphysical_device_test=NOT_RUN\ngoogle_auth=NOT_VERIFIED\n' "$GITHUB_SHA" > release-evidence/release-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VIZIT-0.4.4-DEV-APK
          path: |
            app/build/outputs/apk/dev/debug/app-dev-debug.apk
            release-evidence
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VIZIT-Android-stability-evidence
          path: |
            app/build/reports
            app/build/outputs/androidTest-results
            app/build/test-results
          retention-days: 14
