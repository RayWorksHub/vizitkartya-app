name: Stability source snapshot
on:
  push:
    branches: [fix/beta-share-stability]
    paths: ['.github/workflows/stability-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          mkdir -p snapshots
          git archive --format=zip --output=snapshots/mobile.zip HEAD
          git archive --format=zip --output=snapshots/android-auth.zip origin/feature/dev-google-auth
      - uses: actions/checkout@v4
        with:
          repository: RayWorksHub/digitalis-nevjegy
          ref: 8113b68cf4c70049080615c8d3c5607a77ba73ee
          path: web-snapshot
      - run: git -C web-snapshot archive --format=zip --output="$GITHUB_WORKSPACE/snapshots/web.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: stability-sources
          path: snapshots/*.zip
          retention-days: 3
          if-no-files-found: error
