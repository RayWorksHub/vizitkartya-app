name: Android closed test release
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'config/android-version.properties'
      - 'config/android-node.properties'
      - 'config/sharing.properties'
      - 'scripts/publish-android-node.py'
      - '.github/workflows/android-node-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-closed-test-release
  cancel-in-progress: false
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[play-alpha]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require Play Alpha release credentials
        env:
          KEYSTORE: ${{ secrets.VIZIT_PROD_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VIZIT_PROD_SIGNING_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIZIT_PROD_SIGNING_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VIZIT_PROD_SIGNING_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          [ -n "$KEYSTORE" ] || missing+=(VIZIT_PROD_SIGNING_KEYSTORE_BASE64)
          [ -n "$STORE_PASSWORD" ] || missing+=(VIZIT_PROD_SIGNING_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(VIZIT_PROD_SIGNING_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(VIZIT_PROD_SIGNING_KEY_PASSWORD)
          [ -n "$PLAY_JSON" ] || missing+=(GOOGLE_PLAY_SERVICE_ACCOUNT_JSON)
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if ! printf '%s' "$PLAY_JSON" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("type")=="service_account" and x.get("client_email","").endswith(".gserviceaccount.com")'; then
            echo 'GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not a service account key' >&2
            exit 1
          fi
      - name: Verify Android app version
        id: version
        run: |
          python3 scripts/sync-android-version.py --check
          echo "name=$(python3 scripts/sync-android-version.py --print-version)" >> "$GITHUB_OUTPUT"
          echo "code=$(python3 scripts/sync-android-version.py --print-android-code)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and use existing production upload key
        env:
          KEYSTORE: ${{ secrets.VIZIT_PROD_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VIZIT_PROD_SIGNING_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIZIT_PROD_SIGNING_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VIZIT_PROD_SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p release-output
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/vizit-production.jks"
          fingerprint="$(keytool -exportcert -keystore "$RUNNER_TEMP/vizit-production.jks" -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD | openssl x509 -inform DER -noout -fingerprint -sha256)"
          if [ "$fingerprint" != 'sha256 Fingerprint=9F:F2:DB:8B:71:52:19:55:8D:9D:24:F4:93:EF:5B:76:E9:3A:33:EC:27:4A:0E:08:53:8E:72:E9:30:C1:18:B6' ]; then
            echo 'Upload key differs from the verified VIZIT 7.3.1 release certificate' >&2
            exit 1
          fi
          echo "ORG_GRADLE_PROJECT_VIZIT_PROD_SIGNING_STORE_FILE=$RUNNER_TEMP/vizit-production.jks" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_VIZIT_PROD_SIGNING_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_VIZIT_PROD_SIGNING_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_VIZIT_PROD_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build production AAB and APK
        run: ./gradlew :app:bundleProdRelease :app:assembleProdRelease --no-daemon
      - name: Collect production packages
        env:
          VIZIT_VERSION: ${{ steps.version.outputs.name }}
          VIZIT_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          cp app/build/outputs/bundle/prodRelease/*.aab release-output/
          cp app/build/outputs/apk/prod/release/*.apk release-output/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" release-output/
          git archive --format=zip -o release-output/android-node-source.zip HEAD app config build.gradle.kts gradle gradle.properties gradlew gradlew.bat settings.gradle.kts
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('release-output/build.json').write_text(json.dumps({
            'commit':os.environ['GITHUB_SHA'],'version':os.environ['VIZIT_VERSION'],
            'versionCode':int(os.environ['VIZIT_VERSION_CODE']),
            'package':'hu.rayworks.vizit','backend':'https://vizitkartyam-backend.vercel.app',
            'testsRun':False,'productionSigned':True
          },indent=2))
          PY
      - name: Submit the signed package to Google Play Alpha closed testing
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_TRACK: alpha
          SIGNED: 'true'
        run: python3 scripts/publish-android-node.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VIZIT-${{ steps.version.outputs.name }}-Android-Alpha
          path: release-output/
          retention-days: 14
          if-no-files-found: warn
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/vizit-production.jks"
