name: VIZIT Direct TestFlight

on:
  pull_request:
    branches:
      - feature/ios-web-complete-design-sync-20260920
    paths:
      - .github/workflows/ios.yml
      - ios/**
  push:
    branches:
      - feature/ios-web-complete-design-sync-20260920
    paths:
      - .github/workflows/ios.yml
      - ios/**

permissions:
  contents: read

concurrency:
  group: vizit-direct-testflight
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -project ios/VIZIT.xcodeproj -scheme VIZIT \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            VIZIT_BACKEND_URL=https://vizitkartyam-backend.vercel.app \
            VIZIT_SUPABASE_URL=https://zlrrmkbbyfkbjeqozzde.supabase.co \
            VIZIT_SUPABASE_KEY=sb_publishable_olw6MVbXv4MZooIL1NPZlA_EKc4z1sS \
            VIZIT_AUTH_SCHEME=hu.rayworks.vizit.ios.dev.auth \
            VIZIT_GOOGLE_SIGN_IN_ENABLED=NO \
            VIZIT_PUBLIC_PROFILE_BASE_URL=https://www.vizitkartyam.hu/p \
            build

  upload:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VIZIT_BACKEND_URL: https://vizitkartyam-backend.vercel.app
      VIZIT_SUPABASE_URL: https://zlrrmkbbyfkbjeqozzde.supabase.co
      VIZIT_SUPABASE_KEY: sb_publishable_olw6MVbXv4MZooIL1NPZlA_EKc4z1sS
      VIZIT_PRIVACY_POLICY_URL: ${{ secrets.VIZIT_PRIVACY_POLICY_URL }}
      VIZIT_PRIVACY_POLICY_VERSION: ${{ secrets.VIZIT_PRIVACY_POLICY_VERSION }}
      VIZIT_TERMS_URL: ${{ secrets.VIZIT_TERMS_URL }}
      VIZIT_TERMS_VERSION: ${{ secrets.VIZIT_TERMS_VERSION }}
      VIZIT_AUTH_SCHEME: hu.rayworks.vizit.ios.dev.auth
      VIZIT_GOOGLE_SIGN_IN_ENABLED: "NO"
      VIZIT_PUBLIC_PROFILE_BASE_URL: https://www.vizitkartyam.hu/p
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install signing credentials
        shell: bash
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/VIZIT-distribution.p12"
          profile="$RUNNER_TEMP/VIZIT-App-Store.mobileprovision"
          keychain="$RUNNER_TEMP/VIZIT-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          profile_plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid="$(plutil -extract UUID raw "$profile_plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_path="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          cp "$profile" "$profile_path"

          api_key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$api_key_dir"
          api_key_path="$api_key_dir/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"

          echo "VIZIT_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "VIZIT_PROFILE_PATH=$profile_path" >> "$GITHUB_ENV"
          echo "VIZIT_ASC_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Verify API and authentication configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 20 "$VIZIT_BACKEND_URL/api/auth/config" > "$RUNNER_TEMP/vizit-auth-config.json"
          python3 -c 'import json, os, sys; config=json.load(open(sys.argv[1])); assert config.get("supabase_url")==os.environ["VIZIT_SUPABASE_URL"]; assert config.get("publishable_key")==os.environ["VIZIT_SUPABASE_KEY"]' "$RUNNER_TEMP/vizit-auth-config.json"
          curl --fail --silent --show-error --retry 3 --max-time 20 "$VIZIT_BACKEND_URL/health/database" > /dev/null

      - name: Archive VIZIT 8.7.0
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/VIZIT.xcodeproj \
            -scheme VIZIT \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VIZIT.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            VIZIT_BACKEND_URL="$VIZIT_BACKEND_URL" \
            VIZIT_SUPABASE_URL="$VIZIT_SUPABASE_URL" \
            VIZIT_SUPABASE_KEY="$VIZIT_SUPABASE_KEY" \
            VIZIT_AUTH_SCHEME="$VIZIT_AUTH_SCHEME" \
            VIZIT_GOOGLE_SIGN_IN_ENABLED="$VIZIT_GOOGLE_SIGN_IN_ENABLED" \
            VIZIT_PRIVACY_POLICY_URL="$VIZIT_PRIVACY_POLICY_URL" \
            VIZIT_PRIVACY_POLICY_VERSION="$VIZIT_PRIVACY_POLICY_VERSION" \
            VIZIT_TERMS_URL="$VIZIT_TERMS_URL" \
            VIZIT_TERMS_VERSION="$VIZIT_TERMS_VERSION" \
            VIZIT_PUBLIC_PROFILE_BASE_URL="$VIZIT_PUBLIC_PROFILE_BASE_URL" \
            archive

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/VIZIT-export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VIZIT.xcarchive" \
            -exportOptionsPlist ios/ExportOptions-TestFlight.plist \
            -exportPath "$export_dir"
          ipa="$(find "$export_dir" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          cp "$ipa" "$RUNNER_TEMP/VIZIT-TestFlight.ipa"
          echo "VIZIT_SIGNED_IPA=$RUNNER_TEMP/VIZIT-TestFlight.ipa" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$VIZIT_SIGNED_IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set +e
          test -z "${VIZIT_PROFILE_PATH:-}" || rm -f "$VIZIT_PROFILE_PATH"
          test -z "${VIZIT_ASC_KEY_PATH:-}" || rm -f "$VIZIT_ASC_KEY_PATH"
          test -z "${VIZIT_SIGNING_KEYCHAIN:-}" || security delete-keychain "$VIZIT_SIGNING_KEYCHAIN"
