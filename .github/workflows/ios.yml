name: VIZIT unsigned IPA artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vizit-unsigned-ipa-artifact
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VIZIT_SUPABASE_URL: https://gixihulrptmleltxccxn.supabase.co
      VIZIT_SUPABASE_KEY: sb_publishable_msnliCDr1R9T2t9j-2T-Bg_IgXLWZjH
      VIZIT_PRIVACY_POLICY_URL: ${{ secrets.VIZIT_PRIVACY_POLICY_URL }}
      VIZIT_PRIVACY_POLICY_VERSION: ${{ secrets.VIZIT_PRIVACY_POLICY_VERSION }}
      VIZIT_TERMS_URL: ${{ secrets.VIZIT_TERMS_URL }}
      VIZIT_TERMS_VERSION: ${{ secrets.VIZIT_TERMS_VERSION }}
      VIZIT_AUTH_SCHEME: hu.rayworks.vizit.ios.dev.auth
      VIZIT_GOOGLE_SIGN_IN_ENABLED: "NO"
      VIZIT_PUBLIC_PROFILE_BASE_URL: https://e-nevjegy.vercel.app/p
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Verify Figma release references
        shell: bash
        run: |
          set -euo pipefail
          test -f ios/Release/Figma/13-iOS-Main-App.png
          test -f ios/Release/Figma/14-iOS-Profile-Customization.png

      - name: Build unsigned VIZIT app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/VIZIT.xcodeproj \
            -scheme VIZIT \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            VIZIT_SUPABASE_URL="$VIZIT_SUPABASE_URL" \
            VIZIT_SUPABASE_KEY="$VIZIT_SUPABASE_KEY" \
            VIZIT_AUTH_SCHEME="$VIZIT_AUTH_SCHEME" \
            VIZIT_GOOGLE_SIGN_IN_ENABLED="$VIZIT_GOOGLE_SIGN_IN_ENABLED" \
            VIZIT_PRIVACY_POLICY_URL="$VIZIT_PRIVACY_POLICY_URL" \
            VIZIT_PRIVACY_POLICY_VERSION="$VIZIT_PRIVACY_POLICY_VERSION" \
            VIZIT_TERMS_URL="$VIZIT_TERMS_URL" \
            VIZIT_TERMS_VERSION="$VIZIT_TERMS_VERSION" \
            VIZIT_PUBLIC_PROFILE_BASE_URL="$VIZIT_PUBLIC_PROFILE_BASE_URL" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/VIZIT.app"
          test -d "$app"
          package="$RUNNER_TEMP/ipa-package"
          mkdir -p "$package/Payload"
          cp -R "$app" "$package/Payload/"
          (cd "$package" && /usr/bin/zip -qry "$RUNNER_TEMP/VIZIT-Figma-iOS-unsigned.ipa" Payload)
          /usr/bin/unzip -t "$RUNNER_TEMP/VIZIT-Figma-iOS-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIZIT-Figma-iOS-unsigned
          path: ${{ runner.temp }}/VIZIT-Figma-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
