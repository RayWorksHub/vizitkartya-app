name: iOS native preview
on:
  push:
    branches: [feature/ios-native-preview]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [develop]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and portable core tests
        run: |
          xcodebuild -version
          swift test --package-path ios
      - name: Select available iPhone and iPad simulators
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/simulators.json') as f:
              runtimes = json.load(f)['devices']
          devices = [d for r, ds in sorted(runtimes.items(), reverse=True) if '.iOS-' in r for d in ds if d.get('isAvailable')]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for family, key in [('iPhone', 'IPHONE_ID'), ('iPad', 'IPAD_ID')]:
                  match = next((d for d in devices if d['name'].startswith(family)), None)
                  if match is None:
                      raise SystemExit('No available ' + family + ' simulator')
                  f.write(key + '=' + match['udid'] + '\n')
                  print(family + ': ' + match['name'])
          PY
      - name: iPhone native integration and UI tests
        run: |
          set -o pipefail
          xcodebuild -project ios/VIZIT.xcodeproj -scheme VIZIT -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPHONE_ID" \
            -derivedDataPath "$RUNNER_TEMP/vizit" \
            -resultBundlePath "$RUNNER_TEMP/VIZIT-iPhone.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test \
            | tee "$RUNNER_TEMP/VIZIT-tests.log"
      - name: iPad launch smoke check
        run: |
          xcrun simctl boot "$IPAD_ID"
          xcrun simctl bootstatus "$IPAD_ID" -b
          xcrun simctl install "$IPAD_ID" "$RUNNER_TEMP/vizit/Build/Products/Debug-iphonesimulator/VIZIT.app"
          xcrun simctl launch "$IPAD_ID" hu.rayworks.vizit.ios.dev --ui-testing --reset-test-profile
          sleep 3
          xcrun simctl spawn "$IPAD_ID" launchctl list | grep -F hu.rayworks.vizit.ios.dev
          xcrun simctl io "$IPAD_ID" screenshot "$RUNNER_TEMP/VIZIT-iPad.png"
      - name: Unsigned physical-device compile (not an installable release)
        run: |
          set -o pipefail
          xcodebuild -project ios/VIZIT.xcodeproj -scheme VIZIT -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/vizit-device" \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/VIZIT-device-build.log"
          ditto -c -k --keepParent "$RUNNER_TEMP/vizit/Build/Products/Debug-iphonesimulator/VIZIT.app" "$RUNNER_TEMP/VIZIT-simulator.zip"
      - name: Test evidence and simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VIZIT-iOS-test-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/VIZIT-*.log
            ${{ runner.temp }}/VIZIT-*.xcresult
            ${{ runner.temp }}/VIZIT-*.png
            ${{ runner.temp }}/VIZIT-simulator.zip
