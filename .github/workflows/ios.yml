name: iOS secure IPA

on:
  push:
    branches: [feature/ios-secure-beta, feature/vizit-public-profile-photo, fix/beta-share-stability, claude/vizit-mobile-ui-redesign-4q5ujj, release/ios-8-photo-contact]
    paths: ['ios/**', 'config/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [main, develop]
    paths: ['ios/**', 'config/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # Supabase publishable keys are designed to ship in clients. Authorization
      # is enforced by RLS; service-role credentials must never appear here.
      VIZIT_SUPABASE_URL: https://gixihulrptmleltxccxn.supabase.co
      VIZIT_SUPABASE_KEY: sb_publishable_msnliCDr1R9T2t9j-2T-Bg_IgXLWZjH
      VIZIT_PRIVACY_POLICY_URL: ${{ secrets.VIZIT_PRIVACY_POLICY_URL }}
      VIZIT_PRIVACY_POLICY_VERSION: ${{ secrets.VIZIT_PRIVACY_POLICY_VERSION }}
      VIZIT_TERMS_URL: ${{ secrets.VIZIT_TERMS_URL }}
      VIZIT_TERMS_VERSION: ${{ secrets.VIZIT_TERMS_VERSION }}
      VIZIT_AUTH_SCHEME: hu.rayworks.vizit.ios.dev.auth
      VIZIT_GOOGLE_SIGN_IN_ENABLED: "NO"
      VIZIT_PUBLIC_PROFILE_BASE_URL: https://e-nevjegy.vercel.app/p

    steps:
      - uses: actions/checkout@v4

      - name: Verify shared public endpoint configuration
        run: |
          python3 - <<'PYCONFIG'
          import os, urllib.request
          values = dict(line.strip().split('=',1) for line in open('config/sharing.properties') if '=' in line and not line.startswith('#'))
          assert values['publicProfileBaseUrl'] == os.environ['VIZIT_PUBLIC_PROFILE_BASE_URL']
          with urllib.request.urlopen(values['publicProfileBaseUrl'] + '/csukardi-rajmund', timeout=20) as response:
              assert response.status == 200
              assert 'Mentés a kontaktok közé' in response.read(1000000).decode()
          print('Configured public endpoint: PASS; no production writes')
          PYCONFIG

      - name: Select App Store-compatible Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode_app=/Applications/Xcode_26.3.app
          test -d "$xcode_app" || { echo "Required Xcode 26.3 is not installed"; exit 1; }
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26 || { echo "iOS 26 SDK or later is required"; exit 1; }
          echo "iPhoneOS SDK $sdk_version: PASS"

      - name: Validate build configuration and live Auth policy
        shell: bash
        run: |
          set -euo pipefail
          for name in VIZIT_SUPABASE_URL VIZIT_SUPABASE_KEY VIZIT_AUTH_SCHEME VIZIT_PRIVACY_POLICY_URL VIZIT_PRIVACY_POLICY_VERSION VIZIT_TERMS_URL VIZIT_TERMS_VERSION; do
            test -n "${!name}" || { echo "Missing required configuration: $name"; exit 1; }
          done
          test "$VIZIT_AUTH_SCHEME" = 'hu.rayworks.vizit.ios.dev.auth' || { echo 'Unsafe or stale auth callback scheme'; exit 1; }
          node - <<'NODE'
          const values = [
            process.env.VIZIT_SUPABASE_URL,
            process.env.VIZIT_PRIVACY_POLICY_URL,
            process.env.VIZIT_TERMS_URL,
            process.env.VIZIT_PUBLIC_PROFILE_BASE_URL,
          ]
          for (const value of values) {
            const url = new URL(value)
            if (url.protocol !== 'https:' || url.username || url.password) {
              throw new Error('Every configured service URL must be credential-free HTTPS')
            }
          }
          NODE
          response="$RUNNER_TEMP/auth-settings.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' --header "apikey: $VIZIT_SUPABASE_KEY" "$VIZIT_SUPABASE_URL/auth/v1/settings")"
          test "$status" = 200 || { echo "Supabase Auth settings check failed: HTTP $status"; exit 1; }
          node - "$response" <<'NODE'
          const fs = require('fs')
          const settings = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (settings.disable_signup !== false) throw new Error('User signup is disabled')
          if (settings.mailer_autoconfirm !== false) throw new Error('Email confirmation is disabled')
          if (settings.external?.email !== true) throw new Error('Email/password provider is disabled')
          const googleExpected = process.env.VIZIT_GOOGLE_SIGN_IN_ENABLED === 'YES'
          if (googleExpected && settings.external?.google !== true) throw new Error('Google provider is disabled')
          if (!googleExpected && settings.external?.google === true) throw new Error('Google provider is live but hidden by this build')
          console.log('Live Supabase Auth policy: PASS')
          NODE

      - name: Toolchain and portable core tests
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          swift test --package-path ios

      - name: Resolve exact Swift dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project ios/VIZIT.xcodeproj -scheme VIZIT -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm"
          resolved="$(find ios -name Package.resolved -print -quit)"
          test -n "$resolved"
          python3 - "$resolved" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          pins = {p.get('identity'): p.get('state', {}).get('version') for p in data.get('pins', [])}
          actual = pins.get('supabase-swift')
          if actual != '2.55.2':
              raise SystemExit(f'Expected supabase-swift 2.55.2, resolved {actual!r}')
          print('supabase-swift exact version: PASS')
          PY

      - name: Select available iPhone and iPad simulators
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/simulators.json') as f:
              runtimes = json.load(f)['devices']
          devices = [d for r, ds in sorted(runtimes.items(), reverse=True)
                     if '.iOS-' in r for d in ds if d.get('isAvailable')]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for family, key in [('iPhone', 'IPHONE_ID'), ('iPad', 'IPAD_ID')]:
                  match = next((d for d in devices if d['name'].startswith(family)), None)
                  if match is None:
                      raise SystemExit('No available ' + family + ' simulator')
                  f.write(key + '=' + match['udid'] + '\n')
                  print(family + ': ' + match['name'])
          PY

      - name: iPhone native integration and UI tests
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          args=(-project ios/VIZIT.xcodeproj -scheme VIZIT -configuration Debug)
          args+=(-destination "platform=iOS Simulator,id=$IPHONE_ID" -derivedDataPath "$RUNNER_TEMP/vizit")
          args+=(-clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -disableAutomaticPackageResolution)
          args+=(-resultBundlePath "$RUNNER_TEMP/VIZIT-iPhone.xcresult" -parallel-testing-enabled NO)
          args+=(ARCHS=arm64 ONLY_ACTIVE_ARCH=YES)
          args+=(VIZIT_SUPABASE_URL="$VIZIT_SUPABASE_URL" VIZIT_SUPABASE_KEY="$VIZIT_SUPABASE_KEY")
          args+=(VIZIT_AUTH_SCHEME="$VIZIT_AUTH_SCHEME" VIZIT_GOOGLE_SIGN_IN_ENABLED="$VIZIT_GOOGLE_SIGN_IN_ENABLED")
          args+=(VIZIT_PRIVACY_POLICY_URL="$VIZIT_PRIVACY_POLICY_URL")
          args+=(VIZIT_PRIVACY_POLICY_VERSION="$VIZIT_PRIVACY_POLICY_VERSION" VIZIT_TERMS_URL="$VIZIT_TERMS_URL")
          args+=(VIZIT_TERMS_VERSION="$VIZIT_TERMS_VERSION" VIZIT_PUBLIC_PROFILE_BASE_URL="$VIZIT_PUBLIC_PROFILE_BASE_URL")
          xcodebuild "${args[@]}" test | tee "$RUNNER_TEMP/VIZIT-tests.log"
          grep -Fq '** TEST SUCCEEDED **' "$RUNNER_TEMP/VIZIT-tests.log"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/VIZIT-iPhone.xcresult" > "$RUNNER_TEMP/VIZIT-test-summary.json"
          python3 - "$RUNNER_TEMP/VIZIT-test-summary.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          failed = result.get('failedTests')
          passed = result.get('passedTests')
          skipped = result.get('skippedTests', 0)
          expected = 20
          if failed != 0 or passed != expected or skipped != 0:
              raise SystemExit(f'Invalid test summary: passed={passed}, failed={failed}, skipped={skipped}')
          print(f'Native/UI tests: PASS ({passed} passed, {skipped} skipped, 0 failed)')
          PY

      - name: Export tested iPhone visual evidence
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/VIZIT-iPhone.xcresult"
          attachments="$RUNNER_TEMP/VIZIT-iPhone-attachments"
          test -d "$result"
          mkdir -p "$attachments"
          xcrun xcresulttool export attachments --path "$result" --output-path "$attachments"
          python3 - "$attachments" "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import shutil, sys

          screenshots = sorted(Path(sys.argv[1]).rglob('*.png'))
          if len(screenshots) < 2:
              raise SystemExit(f'Expected at least 2 tested UI screenshots, found {len(screenshots)}')
          for index, source in enumerate(screenshots, start=1):
              target = Path(sys.argv[2]) / f'VIZIT-tested-iPhone-{index:02d}.png'
              shutil.copy2(source, target)
              print(target.name)
          PY
          echo 'Tested iPhone visual evidence: PASS'

      - name: iPad launch smoke check
        run: |
          set -euo pipefail
          xcrun simctl shutdown all
          xcrun simctl boot "$IPAD_ID"
          xcrun simctl bootstatus "$IPAD_ID" -b
          app="$RUNNER_TEMP/vizit/Build/Products/Debug-iphonesimulator/VIZIT.app"
          test -d "$app"
          xcrun simctl install "$IPAD_ID" "$app"
          xcrun simctl launch "$IPAD_ID" hu.rayworks.vizit.ios.dev --ui-testing --reset-test-profile
          sleep 3
          xcrun simctl spawn "$IPAD_ID" launchctl list | grep -F hu.rayworks.vizit.ios.dev
          xcrun simctl io "$IPAD_ID" screenshot "$RUNNER_TEMP/VIZIT-iPad.png"
          echo 'iPad launch smoke check: PASS'

      - name: Compile physical-device app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          args=(-project ios/VIZIT.xcodeproj -scheme VIZIT -configuration Release)
          args+=(-destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/vizit-device")
          args+=(-clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -disableAutomaticPackageResolution)
          args+=(CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER")
          args+=(VIZIT_SUPABASE_URL="$VIZIT_SUPABASE_URL" VIZIT_SUPABASE_KEY="$VIZIT_SUPABASE_KEY")
          args+=(VIZIT_AUTH_SCHEME="$VIZIT_AUTH_SCHEME" VIZIT_GOOGLE_SIGN_IN_ENABLED="$VIZIT_GOOGLE_SIGN_IN_ENABLED")
          args+=(VIZIT_PRIVACY_POLICY_URL="$VIZIT_PRIVACY_POLICY_URL")
          args+=(VIZIT_PRIVACY_POLICY_VERSION="$VIZIT_PRIVACY_POLICY_VERSION" VIZIT_TERMS_URL="$VIZIT_TERMS_URL")
          args+=(VIZIT_TERMS_VERSION="$VIZIT_TERMS_VERSION" VIZIT_PUBLIC_PROFILE_BASE_URL="$VIZIT_PUBLIC_PROFILE_BASE_URL")
          xcodebuild "${args[@]}" build | tee "$RUNNER_TEMP/VIZIT-device-build.log"
          grep -Fq '** BUILD SUCCEEDED **' "$RUNNER_TEMP/VIZIT-device-build.log"

      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/vizit-device/Build/Products/Release-iphoneos/VIZIT.app"
          executable="$app/VIZIT"
          test -d "$app"
          test -f "$executable"
          plutil -lint "$app/Info.plist"
          test -f "$app/PrivacyInfo.xcprivacy"
          file "$executable" | tee "$RUNNER_TEMP/VIZIT-binary.txt"
          file "$executable" | grep -q 'arm64'
          otool -l "$executable" > "$RUNNER_TEMP/VIZIT-load-commands.txt"
          grep -A4 LC_BUILD_VERSION "$RUNNER_TEMP/VIZIT-load-commands.txt" | grep -Eq 'platform[[:space:]]+2'
          ! grep -R -Fq '$(' "$app/Info.plist"
          test "$(plutil -extract VIZITSupabaseURL raw "$app/Info.plist")" = "$VIZIT_SUPABASE_URL"
          test "$(plutil -extract VIZITAuthScheme raw "$app/Info.plist")" = "$VIZIT_AUTH_SCHEME"
          test "$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$app/Info.plist")" = "$VIZIT_AUTH_SCHEME"
          test "$(plutil -extract VIZITGoogleSignInEnabled raw "$app/Info.plist")" = "$VIZIT_GOOGLE_SIGN_IN_ENABLED"
          test "$(plutil -extract VIZITPublicProfileBaseURL raw "$app/Info.plist")" = "$VIZIT_PUBLIC_PROFILE_BASE_URL"
          package="$RUNNER_TEMP/ipa"
          mkdir -p "$package/Payload"
          ditto "$app" "$package/Payload/VIZIT.app"
          (
            cd "$package"
            ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/VIZIT-iOS-DEV-unsigned.ipa"
          )
          unzip -t "$RUNNER_TEMP/VIZIT-iOS-DEV-unsigned.ipa" > "$RUNNER_TEMP/VIZIT-ipa-verify.txt"
          unzip -l "$RUNNER_TEMP/VIZIT-iOS-DEV-unsigned.ipa" | grep -F 'Payload/VIZIT.app/VIZIT'
          shasum -a 256 "$RUNNER_TEMP/VIZIT-iOS-DEV-unsigned.ipa" | tee "$RUNNER_TEMP/VIZIT-iOS-DEV-unsigned.ipa.sha256"
          echo 'Unsigned physical-device IPA: PASS'

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: VIZIT-iOS-DEV-unsigned-IPA
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/VIZIT-iOS-DEV-unsigned.ipa
            ${{ runner.temp }}/VIZIT-iOS-DEV-unsigned.ipa.sha256

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VIZIT-iOS-test-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/VIZIT-*.log
            ${{ runner.temp }}/VIZIT-*.xcresult
            ${{ runner.temp }}/VIZIT-*.png
            ${{ runner.temp }}/VIZIT-test-summary.json
            ${{ runner.temp }}/VIZIT-binary.txt
            ${{ runner.temp }}/VIZIT-load-commands.txt
            ${{ runner.temp }}/VIZIT-ipa-verify.txt

  testflight:
    if: >-
      vars.VIZIT_PHYSICAL_DEVICE_RELEASE_APPROVED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight]')))
    needs: test-and-build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VIZIT_SUPABASE_URL: https://gixihulrptmleltxccxn.supabase.co
      VIZIT_SUPABASE_KEY: sb_publishable_msnliCDr1R9T2t9j-2T-Bg_IgXLWZjH
      VIZIT_PRIVACY_POLICY_URL: ${{ secrets.VIZIT_PRIVACY_POLICY_URL }}
      VIZIT_PRIVACY_POLICY_VERSION: ${{ secrets.VIZIT_PRIVACY_POLICY_VERSION }}
      VIZIT_TERMS_URL: ${{ secrets.VIZIT_TERMS_URL }}
      VIZIT_TERMS_VERSION: ${{ secrets.VIZIT_TERMS_VERSION }}
      VIZIT_AUTH_SCHEME: hu.rayworks.vizit.ios.dev.auth
      VIZIT_GOOGLE_SIGN_IN_ENABLED: "NO"
      VIZIT_PUBLIC_PROFILE_BASE_URL: https://e-nevjegy.vercel.app/p
      APPLE_TEAM_ID: K7BC6R47KA
      APPLE_BUNDLE_ID: hu.rayworks.vizit.ios.dev
      APPLE_PROFILE_NAME: VIZIT App Store
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Select App Store-compatible Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode_app=/Applications/Xcode_26.3.app
          test -d "$xcode_app" || { echo "Required Xcode 26.3 is not installed"; exit 1; }
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26 || { echo "iOS 26 SDK or later is required"; exit 1; }
          echo "iPhoneOS SDK $sdk_version: PASS"

      - name: Validate TestFlight secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD
            APPLE_PROVISIONING_PROFILE_BASE64
            APP_STORE_CONNECT_API_KEY_ID
            APP_STORE_CONNECT_API_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_BASE64
          )
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "Missing required TestFlight secret: $name"; exit 1; }
          done

      - name: Resolve exact Swift dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project ios/VIZIT.xcodeproj \
            -scheme VIZIT \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm"

      - name: Install isolated Apple signing credentials
        shell: bash
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/VIZIT-distribution.p12"
          profile="$RUNNER_TEMP/VIZIT-App-Store.mobileprovision"
          profile_plist="$RUNNER_TEMP/VIZIT-App-Store.plist"
          keychain="$RUNNER_TEMP/VIZIT-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -F 'Apple Distribution'

          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid="$(plutil -extract UUID raw "$profile_plist")"
          test "$(plutil -extract Name raw "$profile_plist")" = "$APPLE_PROFILE_NAME"
          test "$(plutil -extract TeamIdentifier.0 raw "$profile_plist")" = "$APPLE_TEAM_ID"
          test "$(plutil -extract Entitlements.application-identifier raw "$profile_plist")" = "$APPLE_TEAM_ID.$APPLE_BUNDLE_ID"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          installed_profile="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          cp "$profile" "$installed_profile"

          api_key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$api_key_dir"
          api_key_path="$api_key_dir/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"

          {
            echo "VIZIT_SIGNING_KEYCHAIN=$keychain"
            echo "VIZIT_INSTALLED_PROFILE=$installed_profile"
            echo "VIZIT_ASC_KEY_PATH=$api_key_path"
          } >> "$GITHUB_ENV"

      - name: Archive signed VIZIT app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          args=(-project ios/VIZIT.xcodeproj -scheme VIZIT -configuration Release)
          args+=(-destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/VIZIT.xcarchive")
          args+=(-clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -disableAutomaticPackageResolution)
          # Signing settings live on the VIZIT Release target so they are not
          # inherited by Swift package targets that cannot use provisioning profiles.
          args+=(CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER")
          args+=(VIZIT_SUPABASE_URL="$VIZIT_SUPABASE_URL" VIZIT_SUPABASE_KEY="$VIZIT_SUPABASE_KEY")
          args+=(VIZIT_AUTH_SCHEME="$VIZIT_AUTH_SCHEME" VIZIT_GOOGLE_SIGN_IN_ENABLED="$VIZIT_GOOGLE_SIGN_IN_ENABLED")
          args+=(VIZIT_PRIVACY_POLICY_URL="$VIZIT_PRIVACY_POLICY_URL")
          args+=(VIZIT_PRIVACY_POLICY_VERSION="$VIZIT_PRIVACY_POLICY_VERSION" VIZIT_TERMS_URL="$VIZIT_TERMS_URL")
          args+=(VIZIT_TERMS_VERSION="$VIZIT_TERMS_VERSION" VIZIT_PUBLIC_PROFILE_BASE_URL="$VIZIT_PUBLIC_PROFILE_BASE_URL")
          xcodebuild "${args[@]}" archive | tee "$RUNNER_TEMP/VIZIT-archive.log"
          grep -Fq '** ARCHIVE SUCCEEDED **' "$RUNNER_TEMP/VIZIT-archive.log"

      - name: Export and validate signed IPA
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          export_dir="$RUNNER_TEMP/VIZIT-export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VIZIT.xcarchive" \
            -exportOptionsPlist ios/ExportOptions-TestFlight.plist \
            -exportPath "$export_dir" | tee "$RUNNER_TEMP/VIZIT-export.log"

          ipa="$(find "$export_dir" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          verify_dir="$RUNNER_TEMP/VIZIT-signed-verify"
          mkdir -p "$verify_dir"
          unzip -q "$ipa" -d "$verify_dir"
          app="$verify_dir/Payload/VIZIT.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = "$APPLE_BUNDLE_ID"
          test "$(plutil -extract VIZITAuthScheme raw "$app/Info.plist")" = "$VIZIT_AUTH_SCHEME"
          test "$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$app/Info.plist")" = "$VIZIT_AUTH_SCHEME"
          security cms -D -i "$app/embedded.mobileprovision" > "$RUNNER_TEMP/VIZIT-embedded-profile.plist"
          test "$(plutil -extract TeamIdentifier.0 raw "$RUNNER_TEMP/VIZIT-embedded-profile.plist")" = "$APPLE_TEAM_ID"
          test "$(plutil -extract Entitlements.application-identifier raw "$RUNNER_TEMP/VIZIT-embedded-profile.plist")" = "$APPLE_TEAM_ID.$APPLE_BUNDLE_ID"
          unzip -t "$ipa" > "$RUNNER_TEMP/VIZIT-signed-ipa-verify.txt"
          shasum -a 256 "$ipa" | tee "$RUNNER_TEMP/VIZIT-TestFlight.ipa.sha256"
          cp "$ipa" "$RUNNER_TEMP/VIZIT-TestFlight.ipa"
          echo "VIZIT_SIGNED_IPA=$RUNNER_TEMP/VIZIT-TestFlight.ipa" >> "$GITHUB_ENV"
          echo 'Signed App Store IPA: PASS'

      - name: Validate with App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --type ios \
            --file "$VIZIT_SIGNED_IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$VIZIT_SIGNED_IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Upload signed IPA evidence
        uses: actions/upload-artifact@v4
        with:
          name: VIZIT-TestFlight-signed-IPA
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/VIZIT-TestFlight.ipa
            ${{ runner.temp }}/VIZIT-TestFlight.ipa.sha256
            ${{ runner.temp }}/VIZIT-archive.log
            ${{ runner.temp }}/VIZIT-export.log
            ${{ runner.temp }}/VIZIT-signed-ipa-verify.txt

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set +e
          test -z "${VIZIT_INSTALLED_PROFILE:-}" || rm -f "$VIZIT_INSTALLED_PROFILE"
          test -z "${VIZIT_ASC_KEY_PATH:-}" || rm -f "$VIZIT_ASC_KEY_PATH"
          test -z "${VIZIT_SIGNING_KEYCHAIN:-}" || security delete-keychain "$VIZIT_SIGNING_KEYCHAIN"
