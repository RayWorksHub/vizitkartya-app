name: Import verified native ZIP wizard source
on:
  push:
    branches: [fix/zip-wizard-parity-20261003]
    paths: ['design/source-import/**', '.github/workflows/zip-source-import.yml']
permissions:
  contents: write
concurrency:
  group: zip-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/fix/zip-wizard-parity-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source integrity and import native production adapters
        run: python3 design/source-import/import_native.py
      - name: Commit source to repair branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/zip-wizard-parity-20261003'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # One-time transport/import files never become application dependencies.
          git rm -r design/source-import .github/workflows/zip-source-import.yml
          git add app ios config docs
          git diff --cached --check
          git commit -m 'Restore actual native ZIP block wizard and registration routes'
          git push origin "HEAD:$GITHUB_REF_NAME"
