name: Apply scoped VIZIT photo patch
on:
  push:
    branches: [feature/vizit-public-profile-photo]
    paths: ['scripts/apply-profile-photo.py', '.github/workflows/apply-profile-photo.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/vizit-public-profile-photo'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vizit-public-profile-photo
      - name: Apply exact source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-profile-photo.py')
          text=p.read_text()
          old="edit(workflow,'VIZIT_PUBLIC_PROFILE_BASE_URL: https://vizit.hu/p','VIZIT_PUBLIC_PROFILE_BASE_URL: https://vizit-kartya.hu/p')"
          assert text.count(old)==1
          p.write_text(text.replace(old,old[:-1]+',2)'))
          PY
          python3 scripts/apply-profile-photo.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ios/Vizit/App/Screens.swift'); text=p.read_text()
          old='        if usePublicProfile, let url = publicURL { return url.absoluteString }'
          assert text.count(old)==1
          p.write_text(text.replace(old,'        if usePublicProfile { return publicURL?.absoluteString }'))
          p=Path('ios/NativeTests/NativeIntegrationTests.swift'); text=p.read_text()
          text=text.replace('import Contacts','import Contacts\nimport UIKit')
          marker='    func testOnlyDatabaseUniqueViolationIsRetryableAsSlugCollision()'
          assert text.count(marker)==1
          method='''    func testAppleContactsImportsEmbeddedProfilePhoto() throws {
                  var p = profile()
                  let image = UIGraphicsImageRenderer(size: CGSize(width: 32, height: 24)).image { context in
                      UIColor.systemBlue.setFill()
                      context.fill(CGRect(x: 0, y: 0, width: 32, height: 24))
                  }
                  let jpeg = try XCTUnwrap(image.jpegData(compressionQuality: 0.8))
                  p.photoBase64 = jpeg.base64EncodedString()
                  let contacts = try CNContactVCardSerialization.contacts(with: Data(VCard.encode(p, includePhoto: true).utf8))
                  XCTAssertEqual(contacts.count, 1)
                  let imported = try XCTUnwrap(contacts.first?.imageData)
                  XCTAssertNotNil(UIImage(data: imported))
                  XCTAssertEqual(contacts.first?.givenName, "Elek")
              }

          '''
          p.write_text(text.replace(marker,method+marker))
          p=Path('ios/VIZIT.xcodeproj/project.pbxproj'); text=p.read_text()
          assert text.count('MARKETING_VERSION = "0.4.1"')==2
          p.write_text(text.replace('MARKETING_VERSION = "0.4.1"','MARKETING_VERSION = "0.4.2"'))
          # The connected GitHub tool will install the resulting workflow blob;
          # this narrowly scoped CI token commits application source only.
          p=Path('.github/workflows/ios.yml'); text=p.read_text()
          assert text.count('expected = 12')==1
          Path('scripts/vizit-ios-workflow.generated.txt').write_text(text.replace('expected = 12','expected = 13'))
          PY
          git restore .github/workflows/ios.yml
      - run: swift test --package-path ios
      - name: Commit the tested source changes on the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/Vizit/Core/ContactProfile.swift ios/Vizit/App/CloudService.swift ios/Vizit/App/VizitApp.swift ios/Vizit/App/Screens.swift ios/Tests/VizitCoreTests/ProfilePhotoTests.swift ios/NativeTests/NativeIntegrationTests.swift ios/VIZIT.xcodeproj/project.pbxproj scripts/vizit-ios-workflow.generated.txt
          git diff --cached --check
          git commit -m 'feat(ios): sync profile photos and share photo contacts on the corrected domain'
          git push origin HEAD:feature/vizit-public-profile-photo
      - uses: actions/upload-artifact@v4
        with:
          name: vizit-ios-photo-source
          path: ios
          retention-days: 3
