name: Inspect App Store submission readiness

on:
  push:
    branches: [release/asc-inspect-20260928]
    paths: ['.github/workflows/asc-inspect.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - name: Read App Store Connect state without changing it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          def b64url(value):
              return base64.urlsafe_b64encode(value).rstrip(b'=').decode()

          def der_length(value, index):
              length = value[index]
              index += 1
              if length < 128:
                  return length, index
              count = length & 127
              return int.from_bytes(value[index:index + count], 'big'), index + count

          def jwt_signature(value):
              index = 1
              length, index = der_length(value, index)
              assert value[0] == 0x30 and index + length == len(value)
              integers = []
              for _ in range(2):
                  assert value[index] == 0x02
                  length, index = der_length(value, index + 1)
                  integers.append(int.from_bytes(value[index:index + length], 'big'))
                  index += length
              assert index == len(value)
              return b''.join(number.to_bytes(32, 'big') for number in integers)

          needed = ['APP_STORE_CONNECT_API_KEY_ID', 'APP_STORE_CONNECT_API_ISSUER_ID', 'APP_STORE_CONNECT_API_KEY_BASE64']
          for name in needed:
              if not os.environ.get(name):
                  raise SystemExit('Missing App Store Connect credential: ' + name)

          now = int(time.time())
          header = {'alg': 'ES256', 'kid': os.environ['APP_STORE_CONNECT_API_KEY_ID'], 'typ': 'JWT'}
          claims = {'iss': os.environ['APP_STORE_CONNECT_API_ISSUER_ID'], 'iat': now, 'exp': now + 300, 'aud': 'appstoreconnect-v1'}
          message = '.'.join(b64url(json.dumps(part, separators=(',', ':')).encode()) for part in (header, claims))
          with tempfile.TemporaryDirectory() as directory:
              key = Path(directory) / 'AuthKey.p8'
              key.write_bytes(base64.b64decode(os.environ['APP_STORE_CONNECT_API_KEY_BASE64'], validate=True))
              key.chmod(0o600)
              der = subprocess.run(['openssl', 'dgst', '-sha256', '-sign', str(key)], input=message.encode(), capture_output=True, check=True).stdout
          token = message + '.' + b64url(jwt_signature(der))

          def get(path, params=None):
              url = 'https://api.appstoreconnect.apple.com/v1/' + path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return json.load(response)['data']
              except urllib.error.HTTPError as error:
                  raise SystemExit('App Store Connect read failed: HTTP ' + str(error.code)) from None

          apps = get('apps', {'filter[bundleId]': 'hu.rayworks.vizit.ios.dev', 'limit': '2'})
          print('Registered App Store app count:', len(apps))
          if len(apps) != 1:
              raise SystemExit('Expected exactly one registered app for the signed bundle ID')
          app_id = apps[0]['id']
          versions = get('apps/' + app_id + '/appStoreVersions', {'filter[platform]': 'IOS', 'limit': '200'})
          print('Existing iOS App Store versions:', [(version['attributes'].get('versionString'), version['attributes'].get('appStoreState')) for version in versions[:10]])
          for version in versions[:2]:
              localizations = get('appStoreVersions/' + version['id'] + '/appStoreVersionLocalizations')
              print('Store listing localization count:', len(localizations))
              for localization in localizations:
                  attrs = localization['attributes']
                  print('Listing fields:', attrs.get('locale'), 'description=', bool(attrs.get('description')), 'keywords=', bool(attrs.get('keywords')), 'support=', bool(attrs.get('supportUrl')))
                  sets = get('appStoreVersionLocalizations/' + localization['id'] + '/appScreenshotSets')
                  for screenshot_set in sets:
                      screenshots = get('appScreenshotSets/' + screenshot_set['id'] + '/appScreenshots')
                      print('Screenshot set:', screenshot_set['attributes'].get('screenshotDisplayType'), len(screenshots))
                  if not sets:
                      print('Screenshot sets: absent')
              review = get('appStoreVersions/' + version['id'] + '/appStoreReviewDetail')
              print('App review contact details:', bool(review))
          for version in versions:
              attrs = version['attributes']
              if attrs.get('versionString') == '7.3.4':
                  print('App Store 7.3.4 state:', attrs.get('appStoreState'))
                  attached = get('appStoreVersions/' + version['id'] + '/build')
                  print('App Store 7.3.4 attached build:', attached.get('attributes', {}).get('version') if isinstance(attached, dict) else None)
          if not any(version['attributes'].get('versionString') == '7.3.4' for version in versions):
              print('App Store 7.3.4 version record: absent')
          builds = get('builds', {'filter[app]': app_id, 'sort': '-uploadedDate', 'limit': '200'})
          for build in builds:
              attrs = build['attributes']
              print('Recent build:', attrs.get('version'), attrs.get('processingState'))
          for build in builds:
              if build['attributes'].get('version') not in ('143', '156', '158'):
                  continue
              version = build['attributes'].get('version')
              prerelease = get('builds/' + build['id'] + '/preReleaseVersion')
              detail = get('builds/' + build['id'] + '/buildBetaDetail')
              print('Build marketing version:', version, prerelease['attributes'].get('version') if prerelease else None)
              print('Build beta state:', version, detail['attributes'] if detail else None)
          groups = get('apps/' + app_id + '/betaGroups', {'limit': '200'})
          print('Beta group count:', len(groups))
          for group in groups:
              attrs = group['attributes']
              members = get('betaGroups/' + group['id'] + '/builds', {'limit': '200'})
              print('Beta group:', attrs.get('name'), 'internal=', attrs.get('isInternalGroup'), 'all-builds=', attrs.get('hasAccessToAllBuilds'), 'builds=', [member['attributes'].get('version') for member in members])
          print('Expected 8.7.1 build 158 present:', any(build['attributes'].get('version') == '158' for build in builds))
          print('App Store state inspection complete; no changes submitted')
          PY
