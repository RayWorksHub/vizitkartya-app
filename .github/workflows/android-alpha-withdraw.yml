name: Withdraw Android 9+ Alpha releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-alpha-withdraw.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-alpha-withdraw
  cancel-in-progress: false

jobs:
  withdraw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Halt every serving Android 9+ Alpha release
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          import time
          import urllib.parse
          import urllib.request

          package = "hu.rayworks.vizit"
          track = "alpha"
          credentials = json.loads(os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"])
          assert credentials["type"] == "service_account"
          assert credentials["client_email"].endswith(".gserviceaccount.com")

          def encoded(value):
              return base64.urlsafe_b64encode(value).rstrip(b"=")

          now = int(time.time())
          claims = {
              "iss": credentials["client_email"],
              "scope": "https://www.googleapis.com/auth/androidpublisher",
              "aud": "https://oauth2.googleapis.com/token",
              "iat": now,
              "exp": now + 300,
          }
          signing = encoded(json.dumps({"alg": "RS256", "typ": "JWT"}).encode()) + b"." + encoded(json.dumps(claims).encode())
          with tempfile.TemporaryDirectory() as temp:
              key = pathlib.Path(temp) / "key.pem"
              key.write_text(credentials["private_key"])
              key.chmod(0o600)
              signature = subprocess.run(
                  ["openssl", "dgst", "-sha256", "-sign", str(key)],
                  input=signing,
                  capture_output=True,
                  check=True,
              ).stdout
          assertion = (signing + b"." + encoded(signature)).decode()
          token_request = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=urllib.parse.urlencode({
                  "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
                  "assertion": assertion,
              }).encode(),
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )
          with urllib.request.urlopen(token_request, timeout=30) as response:
              token = json.load(response)["access_token"]

          root = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{package}"

          def request(url, method="GET", payload=None):
              assert urllib.parse.urlsplit(url).hostname == "androidpublisher.googleapis.com"
              body = json.dumps(payload).encode() if payload is not None else None
              headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              with urllib.request.urlopen(
                  urllib.request.Request(url, data=body, headers=headers, method=method),
                  timeout=60,
              ) as response:
                  return json.load(response)

          halted = []
          fallback = []
          for _ in range(12):
              edit_id = request(root + "/edits", method="POST", payload={})["id"]
              track_url = root + f"/edits/{edit_id}/tracks/{track}"
              current = request(track_url)
              releases = current.get("releases", [])
              serving = []
              for release in releases:
                  codes = [int(code) for code in release.get("versionCodes", [])]
                  if codes and max(codes) >= 9_000_000 and release.get("status") in {"completed", "inProgress"}:
                      serving.append(release)
              if not serving:
                  fallback = [
                      code
                      for release in releases
                      if release.get("status") == "completed"
                      for code in release.get("versionCodes", [])
                  ]
                  break
              for release in serving:
                  release["status"] = "halted"
                  release.pop("userFraction", None)
                  halted.extend(release.get("versionCodes", []))
              request(track_url, method="PUT", payload={"track": track, "releases": releases})
              request(root + f"/edits/{edit_id}:commit", method="POST", payload={})
          else:
              raise RuntimeError("Too many Android 9+ fallback releases")

          if not halted:
              print("No serving Android 9+ Alpha release remained.")
          print("Halted versionCodes:", ",".join(halted))
          print("Serving fallback versionCodes:", ",".join(fallback))
          if any(int(code) >= 9_000_000 for code in fallback):
              raise RuntimeError("Android 9+ is still serving on Alpha")
          PY
