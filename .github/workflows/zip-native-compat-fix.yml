name: Apply native ZIP compatibility corrections
on:
  push:
    branches: [fix/zip-wizard-parity-20261003]
    paths: ['.github/workflows/zip-native-compat-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed compatibility corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('ios/Vizit/App/ZIPWizardUI.swift')
          b = p.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest() == '721cdc62c2ef5fba0ae072128a220a016a060568'
          s = b.decode()
          old = '.scrollBounceBehavior(.basedOnSize)'
          assert s.count(old) == 1
          s = s.replace(old, '.modifier(ZIPScrollBounceCompatibility())')
          assert s.count('convenience init(zipHex: UInt32, alpha: CGFloat = 1)') == 1
          s = s.replace('convenience init(zipHex: UInt32, alpha: CGFloat = 1)', 'convenience init(zipHex hex: UInt32, alpha: CGFloat = 1)')
          assert s.count('init(zipHex: UInt32, alpha: Double = 1)') == 1
          s = s.replace('init(zipHex: UInt32, alpha: Double = 1)', 'init(zipHex hex: UInt32, alpha: Double = 1)')
          s += '''
          /// Preserve the source's size-aware scrolling where supported, without
          /// raising the production app's iOS 16 minimum deployment target.
          private struct ZIPScrollBounceCompatibility: ViewModifier {
              @ViewBuilder func body(content: Content) -> some View {
                  if #available(iOS 16.4, *) {
                      content.scrollBounceBehavior(.basedOnSize)
                  } else {
                      content
                  }
              }
          }
          '''
          p.write_text(s)
          PY
      - name: Commit only the intended branch correction
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/zip-wizard-parity-20261003'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zip-native-compat-fix.yml
          git add ios/Vizit/App/ZIPWizardUI.swift
          git diff --cached --check
          git commit -m 'Fix native ZIP color initializer names and iOS 16 scroll compatibility'
          git push origin "HEAD:$GITHUB_REF_NAME"
